name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    parity-manifest:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout TypeScript repository
              uses: actions/checkout@v4

            - name: Checkout pinned Python baseline
              uses: actions/checkout@v4
              with:
                  repository: agentscope-ai/agentscope
                  ref: de163b34b909edaba3c174190ad7e1a355e7849f
                  path: python-baseline

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - name: Test parity tooling
              run: node --test scripts/parity/*.test.mjs

            - name: Verify parity manifest against Python
              run: >-
                  node scripts/parity/check-manifest.mjs
                  --python-root python-baseline

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run linter and formatter
              run: pnpm run format

            - name: Verify formatting produced no changes
              run: git diff --exit-code

    check-i18n:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - name: Check i18n keys
              run: node apps/desktop/scripts/check-i18n.js

    test:
        runs-on: ${{ matrix.os }}
        needs: lint

        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node-version: [20.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build agentscope package
              run: pnpm run build:agentscope

            - name: Type-check AgentScope service
              run: pnpm --filter @agentscope-ai/agentscope-service typecheck

            - name: Build AgentScope service package
              run: pnpm run build:service

            - name: Test package installation
              run: pnpm run test:package

            - name: Build Desktop app
              run: pnpm run build:desktop

            - name: Run unit tests
              run: pnpm run test:agentscope

            - name: Run service unit tests
              run: pnpm run test:service

            - name: Upload test coverage
              uses: actions/upload-artifact@v4
              with:
                  name: test-coverage
                  path: packages/agentscope/coverage/
                  if-no-files-found: ignore
